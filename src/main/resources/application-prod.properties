# Activated with SPRING_PROFILES_ACTIVE=prod (Dockerfile sets this by default).
#
# Production-oriented defaults: predictable logging, WAL path suitable for mounted volumes.

spring.application.name=memtsdb

# Structured-ish single-line logs (grep-friendly in Render / Docker logs).
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} - %msg%n

# Fail fast on startup issues where applicable; tune per platform.
spring.main.banner-mode=off

# Graceful shutdown window when platform sends SIGTERM (Docker stop, Render deploy).
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# WAL on persistent volume path is supplied via MEMTSDB_WAL_PATH in containers.
# Override only if defaults in application.properties are insufficient.
