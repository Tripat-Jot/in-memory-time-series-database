# Spring Boot externalized configuration (like appsettings.json + environment variables in ASP.NET Core).
# Property keys map to @ConfigurationProperties beans and @Value injection.

spring.application.name=memtsdb

# HTTP port: Render and many hosts inject PORT; local dev leaves PORT unset → 8080.
server.port=${PORT:8080}

# OpenAPI / Swagger UI (springdoc). UI: http://localhost:8080/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Append-only log (JSON lines). Replayed on startup to rebuild in-memory state.
memtsdb.wal.path=./data/wal/metrics.wal
# Set false for tests that start with an empty store and no file.
memtsdb.wal.replay-enabled=true

# Bounded queue protects heap if disk cannot keep up (back-pressure).
memtsdb.wal.queue-capacity=65536

# Browser CORS for split UI/API hosts. Defaults include local dev + prod UI; override with indexed keys if needed:
# memtsdb.cors.allowed-origin-patterns[0]=https://your-ui.example.com
